<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge Base Explorer</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <!-- Source-markdown code renderer. The OS light/dark preference selects the
         theme via the media-scoped stylesheets (One Light / One Dark). -->
    <link
      rel="stylesheet"
      media="(prefers-color-scheme: light)"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css"
    />
    <link
      rel="stylesheet"
      media="(prefers-color-scheme: dark)"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
      // Highlight the source-markdown block on first paint and after every HTMX
      // swap (the detail panel — and its code block — are swapped in dynamically).
      function highlightMarkdown(root) {
        if (!window.hljs) return;
        (root || document).querySelectorAll("pre code.language-markdown:not(.hljs)").forEach(function (el) {
          window.hljs.highlightElement(el);
        });
      }
      document.addEventListener("DOMContentLoaded", function () {
        highlightMarkdown(document);
        document.body.addEventListener("htmx:afterSwap", function (evt) {
          highlightMarkdown(evt.target);
        });
      });
    </script>
    {% include "_styles_base.html" %}
    <style>
      /* Explorer toolbar aligns its controls to the baseline; the rest of the
         shell chrome comes from _styles_base.html. */
      .toolbar {
        align-items: flex-end;
      }

      .summary {
        font-size: 0.85rem;
        color: #6c5f55;
        padding: 10px 16px;
        border-bottom: 1px solid rgba(31, 26, 22, 0.12);
      }

      .explorer-grid {
        display: flex;
        min-height: 460px;
      }

      .spine {
        flex: 1.05;
        border-right: 1px solid rgba(31, 26, 22, 0.12);
        display: flex;
        flex-direction: column;
      }

      .spine-header,
      .detail-header {
        padding: 12px 16px;
        border-bottom: 1px solid rgba(31, 26, 22, 0.12);
      }

      .doc-title,
      .heading-path {
        font-weight: 600;
      }

      .spine-list {
        overflow: auto;
        padding: 8px;
      }

      .spine-chunk {
        border: 1px solid rgba(31, 26, 22, 0.18);
        border-radius: 6px;
        padding: 8px 10px;
        margin: 6px 4px;
        cursor: pointer;
      }

      .spine-chunk.selected {
        border: 2px solid #6ea8fe;
        background: rgba(110, 168, 254, 0.08);
      }

      .detail {
        flex: 1.2;
        display: flex;
        flex-direction: column;
      }

      .detail-body {
        padding: 14px 16px;
        overflow: auto;
      }

      /* Tinted field + a darker keyline in each kind's hue, so the boxes separate
         from the near-white panel by color rather than by a drop-shadow card. */
      .representation,
      .raw-chunk {
        border: 1px solid;
        border-radius: 6px;
        padding: 12px;
        margin-top: 6px;
        line-height: 1.5;
      }

      /* Contextualized representation — the consumed output. Blue, matching the
         selected-chunk and search-highlight cue. */
      .representation {
        background: #e7eeff;
        border-color: #4a82e0;
      }

      /* No active variant: a muted placeholder, not a content field. */
      .representation.none {
        background: #faf7f1;
        border-color: rgba(31, 26, 22, 0.18);
        color: #6c5f55;
      }

      /* Raw chunk — warm tan, set apart from the blue contextualized field. */
      .raw-chunk {
        background: #f6ecd6;
        border-color: #b07f33;
      }

      mark {
        background: rgba(110, 168, 254, 0.28);
      }

      .provenance {
        font-size: 0.85rem;
        color: #6c5f55;
        margin-top: 6px;
        line-height: 1.7;
      }

      /* Source markdown — a real code block. Its background and token colors come
         from the highlight.js theme, which the OS light/dark preference selects
         (One Light / One Dark via the media-scoped <link>s in <head>). */
      .markdown-text {
        margin: 6px 0 0;
        max-height: 240px;
        overflow: auto;
        border: 1px solid rgba(31, 26, 22, 0.25);
        border-radius: 6px;
      }

      .markdown-text code.hljs {
        display: block;
        padding: 10px 12px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 0.82rem;
        line-height: 1.55;
        white-space: pre-wrap;
        border-radius: 6px;
      }

      .results-legend,
      .result-pair {
        display: flex;
      }

      .results-legend {
        gap: 12px;
        padding: 2px 16px 8px;
      }

      .results-legend .label {
        flex: 1;
      }

      .result-row {
        border: 1px solid rgba(31, 26, 22, 0.18);
        border-radius: 6px;
        margin: 6px 10px;
        cursor: pointer;
        background: #fffdf8;
      }

      /* Alternating row tint so adjacent matches are easy to tell apart. */
      .result-row:nth-child(even) {
        background: #f4efe6;
      }

      .result-row:hover {
        border-color: #6ea8fe;
      }

      .result-head {
        display: flex;
        justify-content: space-between;
        padding: 8px 12px;
        border-bottom: 1px solid rgba(31, 26, 22, 0.12);
      }

      .result-raw,
      .result-contextualized {
        flex: 1;
        padding: 10px 12px;
        font-size: 0.9em;
      }

      .result-raw {
        border-right: 1px solid rgba(31, 26, 22, 0.12);
      }

      .results-empty,
      .spine-empty,
      .detail-empty {
        text-align: center;
        padding: 32px 16px;
        color: #6c5f55;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      {% include "_nav.html" %}
      <header>
        <h1>Knowledge Base Explorer</h1>
        <p>Browse a document's chunks in reading order and search the active content, raw and contextualized.</p>
      </header>

      <section class="panel">
        <form
          class="toolbar"
          hx-post="/ui/explore/chunks/search"
          hx-target="#search-results"
          hx-swap="outerHTML"
        >
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
            <label for="search-query">Search content</label>
            <input id="search-query" type="text" name="query" placeholder="search content…" autocomplete="off" />
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="search-kind">Match in</label>
            <select id="search-kind" name="kind">
              <option value="either" selected>either</option>
              <option value="chunk">chunk</option>
              <option value="contextualized">contextualized</option>
            </select>
          </div>
          <button type="submit">Search</button>
        </form>

        <div id="search-results"></div>
      </section>

      {% include "explorer_panel.html" %}
    </div>
  </body>
</html>
