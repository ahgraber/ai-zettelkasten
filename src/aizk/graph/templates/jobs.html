<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contextualization Jobs</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        color: #1f1a16;
        background: #f6f2eb;
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      .panel {
        margin-top: 16px;
        background: #fffdf8;
        border: 1px solid rgba(31, 26, 22, 0.12);
        border-radius: 12px;
        overflow: hidden;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(31, 26, 22, 0.12);
      }

      .control {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 200px;
      }

      label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6c5f55;
      }

      input[type="text"],
      select {
        border: 1px solid rgba(31, 26, 22, 0.18);
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
      }

      .summary {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 0.85rem;
        color: #6c5f55;
        padding: 10px 16px;
        border-bottom: 1px solid rgba(31, 26, 22, 0.12);
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 980px;
      }

      th,
      td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(31, 26, 22, 0.12);
        font-size: 0.9rem;
      }

      th {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6c5f55;
      }

      .mono {
        font-family: ui-monospace, monospace;
        font-size: 0.82rem;
      }

      .uuid {
        max-width: 160px;
        word-break: break-all;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 8px 14px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: rgba(31, 26, 22, 0.08);
        color: #1f1a16;
      }

      .btn-primary {
        background: #b44b33;
        color: white;
      }

      .btn-danger {
        background: #2f1f19;
        color: #f8e9e1;
      }

      .sortable {
        background: none;
        padding: 0;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.72rem;
        color: inherit;
      }

      .bulk-actions,
      .pager,
      .notice {
        padding: 12px 16px;
        border-top: 1px solid rgba(31, 26, 22, 0.12);
      }

      .bulk-actions {
        display: flex;
        gap: 10px;
      }

      .pager {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 0.88rem;
        color: #6c5f55;
      }

      .pager a {
        text-decoration: none;
        color: #1f1a16;
        border: 1px solid rgba(31, 26, 22, 0.18);
        padding: 6px 12px;
        border-radius: 999px;
      }

      .pager a[aria-disabled="true"] {
        pointer-events: none;
        color: #6c5f55;
      }

      .empty {
        text-align: center;
        padding: 32px 16px;
        color: #6c5f55;
      }

      #drilldown {
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>Contextualization Jobs</h1>
        <p>Operator view over all contextualization work-units with server-side search, sort, and bulk actions.</p>
      </header>

      {% include "jobs_panel.html" %}

      <div id="drilldown"></div>
    </div>
  </body>
</html>
